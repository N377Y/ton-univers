<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050817">
  <meta name="description" content="Un dernier passage t’attend.">
  <title>Aux origines de ton univers</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-12 -12 24 24'%3E%3Ccircle r='12' fill='%23050817'/%3E%3Cpath d='M0,-8 L1.5,-1.5 L8,0 L1.5,1.5 L0,8 L-1.5,1.5 L-8,0 L-1.5,-1.5 Z' fill='%23ffd27a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="sas">
  <div id="cine">
    <div id="enter">
      <div id="stage" class="fading"></div>
      <canvas id="dust" aria-hidden="true"></canvas>
    </div>
  </div>
  <div id="vignette" aria-hidden="true"></div>
  <div id="grain" aria-hidden="true"></div>
  <div id="flash" aria-hidden="true"></div>
  <div id="shade" aria-hidden="true"></div>

  <header id="hud">
    <p id="actlabel"></p>
    <ol id="progress" hidden aria-label="Progression"><li></li><li></li><li></li><li></li><li></li></ol>
    <div class="hud-btns">
      <button id="soundbtn" class="icon" type="button" aria-pressed="false" aria-label="Activer le son">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="mute" d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="menubtn" class="icon" type="button" aria-label="Menu" aria-controls="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M5 12h14M5 16h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div id="actintro" hidden role="presentation"></div>

  <aside id="zonecard" hidden>
    <button id="zonecard-toggle" type="button" aria-label="Afficher ou masquer les détails"><h2></h2><span class="chev" aria-hidden="true"></span></button>
    <ul></ul>
  </aside>

  <section id="caption">
    <p id="caption-text" aria-live="polite"></p>
    <p id="wish" hidden></p>
    <p id="hint" aria-live="polite"></p>
    <div id="actions" hidden></div>
  </section>

  <form id="lockform" hidden autocomplete="off">
    <label for="code" class="visually-hidden">Code final</label>
    <input id="code" name="code" type="text" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="La clé" maxlength="40">
    <button type="submit" class="btn primary">Ouvrir</button>
  </form>

  <nav id="controls" hidden>
    <button id="prev" class="btn ghost" type="button" aria-label="Scène précédente">‹</button>
    <button id="next" class="btn primary" type="button"><span>Continuer</span> ›</button>
  </nav>

  <section id="map" hidden aria-label="Carte de ton univers">
    <svg id="mapsvg" viewBox="0 0 400 560" preserveAspectRatio="xMidYMid meet"></svg>
    <p class="map-hint">Touche un lieu pour le revisiter.</p>
    <div class="map-actions"><button id="map-replay" class="btn" type="button">Revoir l’histoire</button></div>
  </section>

  <section id="soundask" class="overlay" hidden role="dialog" aria-labelledby="soundask-title">
    <div class="panel">
      <h2 id="soundask-title">Le passage est ouvert.</h2>
      <p>Cette histoire peut s’accompagner d’un léger fond sonore. Aucune parole : tout est écrit à l’écran.</p>
      <div class="row">
        <button id="sound-on" class="btn primary" type="button">Activer le son</button>
        <button id="sound-off" class="btn" type="button">Continuer sans le son</button>
      </div>
    </div>
  </section>

  <section id="resume" class="overlay" hidden role="dialog" aria-labelledby="resume-title">
    <div class="panel">
      <p class="kicker">Aux origines de ton univers</p>
      <h2 id="resume-title">Ton univers t’attend.</h2>
      <div id="resume-actions" class="col"></div>
    </div>
  </section>

  <div id="menu" class="overlay" hidden role="dialog" aria-label="Réglages">
    <div class="panel">
      <h2>Réglages</h2>
      <label class="opt"><input id="opt-sound" type="checkbox"> Son</label>
      <label class="opt"><input id="opt-reduced" type="checkbox"> Réduire les animations</label>
      <div class="col">
        <button id="menu-map" class="btn" type="button" hidden>Carte de mon univers</button>
        <button id="menu-restart" class="btn" type="button" hidden>Recommencer l’histoire</button>
        <button id="menu-close" class="btn primary" type="button">Fermer</button>
      </div>
    </div>
  </div>

  <noscript><p class="noscript">Ce récit a besoin de JavaScript pour s’afficher.</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/sha256.js"></script>
  <script src="js/gfx.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
